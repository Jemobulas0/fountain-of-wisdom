<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gate Wordmark Test</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  body { background:#0a0c10; color:#c8cdd8; font-family:Georgia,serif; margin:0; padding:40px 24px; }
  .wrap { max-width:1280px; margin:0 auto; }
  h1 { font-size:13px; letter-spacing:3px; text-transform:uppercase; color:#c9a84c; font-weight:400; margin:0 0 32px; }
  .row { border-bottom:1px solid #2a2f3d; padding:28px 0; }
  .name { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#6b7280; margin-bottom:18px; }
  .sizes { display:flex; align-items:center; gap:44px; flex-wrap:wrap; color:#c9a84c; }
  .cap { font-size:10px; color:#6b7280; margin-top:6px; font-style:italic; text-align:center; }

  .mark { font-family:'Cinzel',serif; font-weight:700; color:#e8ecf4; letter-spacing:6px; line-height:1.25; white-space:nowrap; }
  .mark .gold { color:#c9a84c; }
  .gate { display:inline-block; vertical-align:-0.30em; width:1.12em; height:1.12em; color:#c9a84c; margin-left:-0.09em; margin-right:-0.05em; }

  .banner { width:1200px; height:630px; background:#0a0c10; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-direction:column; }
  .banner-glow { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 40%, rgba(201,168,76,0.10) 0%, transparent 62%); }
  .banner-grid { position:absolute; inset:0; background-image:linear-gradient(rgba(201,168,76,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,0.03) 1px,transparent 1px); background-size:70px 70px; mask-image:radial-gradient(ellipse at center, black 15%, transparent 72%); }
  .banner-inner { position:relative; z-index:1; text-align:center; }
  .banner .mark { font-size:88px; }
  .rule { width:240px; height:1px; background:linear-gradient(90deg,transparent,#c9a84c,transparent); margin:34px auto 26px; }
  .tag { font-family:'Cinzel',serif; font-size:19px; letter-spacing:6px; text-transform:uppercase; color:#6b7280; }
  .scaled { transform:scale(0.62); transform-origin:top left; height:391px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="gate-red" viewBox="0 0 100 100">
  <path d="M 22.31,15.81 A 44,44 0 0 1 77.69,15.81" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
  <path d="M 40.11,81.48 A 33,33 0 1 0 18.53,59.92" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
  <path d="M 70.98,56.62 A 22,22 0 1 0 56.59,70.99" fill="none" stroke="#e03a2a" stroke-width="7" stroke-linecap="round"/>
</symbol>
<symbol id="gate-blue" viewBox="0 0 100 100">
  <path d="M 22.31,15.81 A 44,44 0 0 1 77.69,15.81" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
  <path d="M 40.11,81.48 A 33,33 0 1 0 18.53,59.92" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
  <path d="M 70.98,56.62 A 22,22 0 1 0 56.59,70.99" fill="none" stroke="#3ec6e0" stroke-width="7" stroke-linecap="round"/>
</symbol>
</defs></svg>

<div class="wrap">
<h1>Twin Gate O — structure test</h1>

<div class="row">
  <div class="name">The gate alone</div>
  <div class="sizes">
    <div><svg width="240" height="240"><use href="#gate-red"/></svg><div class="cap">240</div></div>
    <div><svg width="120" height="120"><use href="#gate-red"/></svg><div class="cap">120</div></div>
    <div><svg width="240" height="240"><use href="#gate-blue"/></svg><div class="cap">240</div></div>
    <div><svg width="120" height="120"><use href="#gate-blue"/></svg><div class="cap">120</div></div>
    <div><svg width="64" height="64"><use href="#gate-blue"/></svg><div class="cap">64</div></div>
    <div><svg width="32" height="32"><use href="#gate-blue"/></svg><div class="cap">32</div></div>
  </div>
</div>

<div class="row">
  <div class="name">Wordmark — inline at 48px</div>
  <div class="mark" style="font-size:48px">THE F<svg class="gate"><use href="#gate-red"/></svg>UNTAIN</div>
  <div class="mark gold" style="font-size:48px">OF WISD<svg class="gate"><use href="#gate-blue"/></svg>M</div>
</div>

<div class="row">
  <div class="name">Wordmark — inline at 28px</div>
  <div class="mark" style="font-size:28px">THE F<svg class="gate"><use href="#gate-red"/></svg>UNTAIN</div>
  <div class="mark gold" style="font-size:28px">OF WISD<svg class="gate"><use href="#gate-blue"/></svg>M</div>
</div>

<div class="row" style="border-bottom:none">
  <div class="name">OG banner — 1200 × 630, shown at 62%</div>
  <div class="scaled">
    <div class="banner">
      <div class="banner-glow"></div>
      <div class="banner-grid"></div>
      <div class="banner-inner">
        <div class="mark">THE F<svg class="gate"><use href="#gate-red"/></svg>UNTAIN</div>
        <div class="mark gold">OF WISD<svg class="gate"><use href="#gate-blue"/></svg>M</div>
        <div class="rule"></div>
        <div class="tag">Know the game · Master yourself</div>
      </div>
    </div>
  </div>
</div>

</div>
</body>
</html>
